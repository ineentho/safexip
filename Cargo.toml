[package]
name = "safexip"
version = "0.2.2"
edition = "2021"
rust-version = "1.88"
description = "Self-hosted xip-style authoritative DNS server with an ACME DNS-01 API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ineentho/safexip"
homepage = "https://github.com/ineentho/safexip"
readme = "README.md"

[dependencies]
hickory-proto = "0.26.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
base64 = "0.22"
subtle = "2"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }

[dev-dependencies]
futures-util = "0.3"
