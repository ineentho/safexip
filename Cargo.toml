[package]
name = "safexip"
version = "0.1.0"
edition = "2021"

[dependencies]
hickory-proto = "0.24"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = "0.4"
base64 = "0.22"
rand = "0.8"

[package.metadata.deb]
name = "safexip"
maintainer = "Henrik Karlsson <henrik@example.com>"
copyright = "2026 Henrik Karlsson"
extended-description = "Self-hosted xip-style DNS server with ACME DNS-01 API for wildcard TLS certs"
section = "net"
priority = "optional"
depends = "$auto"
assets = [
  ["target/release/safexip", "usr/bin/", "755"],
  ["safexip.service", "lib/systemd/system/", "644"],
]
