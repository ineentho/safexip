name: safexip
arch: ${PACKAGE_ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Henrik Karlsson <henrik@example.com>
vendor: Henrik Karlsson
homepage: https://github.com/henrikkarlsson/safexip
license: MIT
description: Self-hosted xip-style DNS server with ACME DNS-01 API for wildcard TLS certs.
contents:
  - src: ./target/release/safexip
    dst: /usr/bin/safexip
    file_info:
      mode: 0755
  - src: ./safexip.service
    dst: /usr/lib/systemd/system/safexip.service
    file_info:
      mode: 0644
  - dst: /etc/safexip
    type: dir
    file_info:
      mode: 0755
  - src: ./packaging/safexip.env
    dst: /etc/safexip/env
    type: config|noreplace
    file_info:
      mode: 0600
scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  postremove: ./packaging/scripts/postremove.sh
