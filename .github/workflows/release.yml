name: release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PACKAGE_ARCH: amd64
  DOCKERHUB_USERNAME: ineentho
  DOCKERHUB_REPOSITORY: ineentho/safexip

jobs:
  quality:
    name: Verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - name: Resolve and verify version
        id: version
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$cargo_version" ]]; then
              echo "tag version $version does not match Cargo version $cargo_version" >&2
              exit 1
            fi
          else
            version="$cargo_version"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semantic version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  packages:
    name: Build release packages
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build static package binary
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          binary=target/x86_64-unknown-linux-musl/release/safexip
          "$binary" --version
          if readelf --program-headers "$binary" | grep -q 'Requesting program interpreter'; then
            echo "package binary is dynamically linked" >&2
            exit 1
          fi

      - name: Install verified nFPM
        run: |
          base_url="https://github.com/goreleaser/nfpm/releases/download/v2.47.0"
          curl --fail --location --silent --show-error "$base_url/checksums.txt" -o /tmp/nfpm-checksums.txt
          curl --fail --location --silent --show-error "$base_url/nfpm_2.47.0_amd64.deb" -o /tmp/nfpm_2.47.0_amd64.deb
          grep ' nfpm_2.47.0_amd64.deb$' /tmp/nfpm-checksums.txt | (cd /tmp && sha256sum --check -)
          sudo dpkg -i /tmp/nfpm_2.47.0_amd64.deb
          nfpm --version

      - name: Build packages
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          mkdir -p dist
          for packager in deb rpm apk archlinux; do
            nfpm package --config nfpm.yaml --packager "$packager" --target dist/
          done
          sha256sum dist/* > dist/SHA256SUMS

      - name: Build lifecycle fixtures
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          mkdir -p dist-fixtures
          for fixture_version in 0.0.0 0.0.1; do
            for packager in deb apk; do
              VERSION="$fixture_version" nfpm package \
                --config nfpm.yaml --packager "$packager" --target dist-fixtures/
            done
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: safexip-packages
          path: dist/*
          if-no-files-found: error

      - name: Upload lifecycle fixtures
        uses: actions/upload-artifact@v7
        with:
          name: safexip-package-fixtures
          path: dist-fixtures/*
          if-no-files-found: error

  package-tests:
    name: Test ${{ matrix.format }} package
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm, apk, archlinux]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: safexip-packages
          path: dist

      - name: Install and run package
        run: packaging/tests/install-package.sh "${{ matrix.format }}" "$PWD/dist"

  package-lifecycle:
    name: Test package lifecycle
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: safexip-packages
          path: dist

      - name: Download lifecycle fixtures
        uses: actions/download-artifact@v8
        with:
          name: safexip-package-fixtures
          path: dist-fixtures

      - name: Install DNS test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl dnsutils

      - name: Test systemd install, upgrade, protocols, and removal
        run: packaging/tests/systemd-lifecycle.sh "$PWD/dist" "$PWD/dist-fixtures"

      - name: Test OpenRC install, upgrade, and removal
        run: packaging/tests/openrc-lifecycle.sh "$PWD/dist" "$PWD/dist-fixtures"

  docker:
    name: Build and push Docker image
    needs: quality
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build Docker binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --locked
          cargo build --release --locked --target aarch64-unknown-linux-gnu
          mkdir -p dist/docker/amd64 dist/docker/arm64
          cp target/release/safexip dist/docker/amd64/safexip
          cp target/aarch64-unknown-linux-gnu/release/safexip dist/docker/arm64/safexip

      - name: Require Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_TOKEN"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPOSITORY }}:${{ needs.quality.outputs.version }}
            ${{ env.DOCKERHUB_REPOSITORY }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.quality.outputs.version }}

  publish:
    name: Publish GitHub release
    needs: [quality, packages, package-tests, package-lifecycle, docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: safexip-packages
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
