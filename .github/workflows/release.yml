name: release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      generate_release_notes:
        description: Generate notes when creating a release manually
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PACKAGE_ARCH: amd64
  DOCKERHUB_USERNAME: ineentho
  DOCKERHUB_REPOSITORY: ineentho/safexip

jobs:
  quality:
    name: Verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate production documentation
        run: scripts/validate-production-docs.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
        with:
          components: clippy, rustfmt
      - name: Resolve and verify version
        id: version
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            test "$version" = "$cargo_version" || {
              echo "tag version $version does not match Cargo version $cargo_version" >&2
              exit 1
            }
          else
            version="$cargo_version"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid semantic version: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Unit and real-listener integration tests
        run: cargo test --all-targets --locked
      - name: Bounded TCP connection abuse test
        run: |
          ulimit -n 4096
          cargo test --test server_e2e tcp_connection_limit_releases_capacity --locked -- --ignored --exact
      - name: Audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  packages:
    name: Build release packages
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build static package binary
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          binary=target/x86_64-unknown-linux-musl/release/safexip
          "$binary" --version
          if readelf --program-headers "$binary" | grep -q 'Requesting program interpreter'; then
            echo "package binary is dynamically linked" >&2
            exit 1
          fi

      - name: Install verified nFPM
        run: |
          base_url="https://github.com/goreleaser/nfpm/releases/download/v2.47.0"
          curl --fail --location --silent --show-error "$base_url/nfpm_2.47.0_amd64.deb" -o /tmp/nfpm_2.47.0_amd64.deb
          echo '3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97  /tmp/nfpm_2.47.0_amd64.deb' \
            | sha256sum --check --strict
          sudo dpkg -i /tmp/nfpm_2.47.0_amd64.deb
          nfpm --version

      - name: Build packages
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          mkdir -p dist
          for packager in deb rpm apk archlinux; do
            nfpm package --config nfpm.yaml --packager "$packager" --target dist/
          done
          sha256sum dist/* > dist/SHA256SUMS

      - name: Build lifecycle fixtures
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          mkdir -p dist-fixtures
          for fixture_version in 0.0.0 0.0.1; do
            for packager in deb apk; do
              VERSION="$fixture_version" nfpm package \
                --config nfpm.yaml --packager "$packager" --target dist-fixtures/
            done
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: safexip-packages
          path: dist/*
          if-no-files-found: error

      - name: Upload lifecycle fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: safexip-package-fixtures
          path: dist-fixtures/*
          if-no-files-found: error

  package-tests:
    name: Test ${{ matrix.format }} package
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm, apk, archlinux]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: safexip-packages
          path: dist

      - name: Install and run package
        run: packaging/tests/install-package.sh "${{ matrix.format }}" "$PWD/dist"

  package-lifecycle:
    name: Test package lifecycle
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: safexip-packages
          path: dist

      - name: Download lifecycle fixtures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: safexip-package-fixtures
          path: dist-fixtures

      - name: Install DNS test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl dnsutils

      - name: Test systemd install, upgrade, protocols, and removal
        run: packaging/tests/systemd-lifecycle.sh "$PWD/dist" "$PWD/dist-fixtures"

      - name: Test OpenRC install, upgrade, and removal
        run: packaging/tests/openrc-lifecycle.sh "$PWD/dist" "$PWD/dist-fixtures"

  package-smoke:
    name: Smoke ${{ matrix.format }} package
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            base: ubuntu:24.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y systemd systemd-sysv
          - format: rpm
            base: fedora:latest
            install: dnf install -y systemd
          - format: arch
            base: archlinux:latest
            install: pacman -Sy --noconfirm systemd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: safexip-packages
          path: dist
      - name: Build package test environment
        env:
          BASE: ${{ matrix.base }}
          INSTALL: ${{ matrix.install }}
        run: |
          cat >Dockerfile.package-smoke <<EOF
          FROM ${BASE}
          RUN ${INSTALL}
          COPY scripts/smoke-package.sh /usr/local/bin/smoke-package
          RUN chmod 0755 /usr/local/bin/smoke-package
          STOPSIGNAL SIGRTMIN+3
          ENTRYPOINT ["/sbin/init"]
          EOF
          docker build -f Dockerfile.package-smoke -t safexip-package-smoke:${{ matrix.format }} .
      - name: Install package and start systemd service
        run: |
          name=safexip-package-${{ matrix.format }}
          docker run -d --name "$name" --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD/dist:/artifacts:ro" \
            safexip-package-smoke:${{ matrix.format }}
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 100); do
            state="$(docker exec "$name" systemctl is-system-running 2>/dev/null || true)"
            [[ "$state" == running || "$state" == degraded ]] && break
            sleep 0.1
          done
          test "$(docker inspect --format '{{.State.Running}}' "$name")" = true
          case '${{ matrix.format }}' in
            deb) pattern='/artifacts/*.deb' ;;
            rpm) pattern='/artifacts/*.rpm' ;;
            arch) pattern='/artifacts/*.pkg.tar.zst' ;;
          esac
          docker exec "$name" bash -lc "/usr/local/bin/smoke-package $pattern"

  docker-build:
    name: Build and smoke image (${{ matrix.arch }})
    needs: quality
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Require Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_TOKEN"
      - name: Build untagged image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.DOCKERHUB_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.quality.outputs.version }}
      - name: Smoke exact release digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl dnsutils
          docker pull --platform 'linux/${{ matrix.arch }}' "${DOCKERHUB_REPOSITORY}@${DIGEST}"
          ./scripts/smoke-container.sh "${DOCKERHUB_REPOSITORY}@${DIGEST}"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  docker-publish:
    name: Publish validated multi-platform image
    needs: [quality, docker-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: docker-digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create public tags from validated digests
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          sources=()
          for digest in /tmp/digests/*; do
            sources+=("${DOCKERHUB_REPOSITORY}@sha256:$(basename "$digest")")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create \
            -t "${DOCKERHUB_REPOSITORY}:${VERSION}" \
            -t "${DOCKERHUB_REPOSITORY}:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "${DOCKERHUB_REPOSITORY}:${VERSION}"

  publish:
    name: Publish GitHub release
    needs: [quality, packages, package-tests, package-lifecycle, package-smoke, docker-publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: safexip-packages
          path: dist
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/*
          generate_release_notes: ${{ inputs.generate_release_notes }}
